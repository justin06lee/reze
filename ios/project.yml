# The phone app's Xcode project, written down. `make ios` turns this into
# ios/Reze.xcodeproj with xcodegen and opens it; the project itself is not
# kept in git, so this file is the only place to change it.
#
# Three targets and one package:
#   Reze          the app: asks which Mac, fetches its library, copies macros
#   RezeKeyboard  the keyboard: types the macros the app fetched
#   RezeUITests   drives both in a simulator, against a real Mac (make ios-uitest)
#   RezeKit       (ios/RezeKit) everything they are made of
name: Reze

options:
  bundleIdPrefix: com.justin06lee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # "Huiyun Lee", the team the Mac app is signed by. Xcode makes the
    # certificate, the app ids and the App Group itself the first time it
    # builds for a phone ("Automatically manage signing").
    DEVELOPMENT_TEAM: 65UN46K6FA
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RezeKit:
    path: RezeKit

targets:
  Reze:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RezeKit
        product: RezeKit
      - package: RezeKit
        product: RezeUI
      - target: RezeKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justin06lee.reze.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # A Release build is the one that goes to TestFlight, signed with a
        # profile made through the App Store Connect API (ios/asc.ts) and
        # named here. Debug stays automatic, for running from Xcode.
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Reze App Store
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Reze
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A Mac's Reze speaks plain HTTP, on its Tailscale address only:
        # Tailscale is what encrypts it and what says who is asking. iOS
        # refuses plain HTTP unless told otherwise, and the Mac may be named
        # by an address, a bare name or a full MagicDNS name, so there is no
        # one domain to make the exception for. The app talks to the one
        # machine that was typed into it and to nothing else.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/Reze.entitlements
      properties:
        # Where the app keeps the library for the keyboard to read. The same
        # name is `Shelf.group` in RezeKit; the three have to agree.
        com.apple.security.application-groups:
          - group.com.justin06lee.reze

  RezeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    dependencies:
      - package: RezeKit
        product: RezeKit
      - package: RezeKit
        product: RezeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justin06lee.reze.ios.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Reze Keyboard App Store
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Reze
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Asks for the "Allow Full Access" switch to exist. It is off
            # until the person turns it on; without it the keyboard types
            # text and cannot reach the clipboard, which pictures need.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/RezeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.justin06lee.reze

  RezeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Reze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justin06lee.reze.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Reze

schemes:
  Reze:
    build:
      targets:
        Reze: all
        RezeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RezeUITests
