<!--
  Reze app icon — original artwork.

  A bomb-head wearing a pulled grenade pin, nodding at the Bomb Devil's
  pin-in-the-neck without copying any existing character art. It also happens
  to be the app's whole premise: pull a tiny pin, get an explosion.

  Authored at 1024x1024 with the macOS icon grid baked in (824x824 body,
  100px margin) so `tauri icon` only ever has to downscale.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d0e1c" />
      <stop offset="0.5" stop-color="#7c1a31" />
      <stop offset="1" stop-color="#c62c48" />
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.6">
      <stop offset="0" stop-color="#ffc98f" stop-opacity="0.5" />
      <stop offset="0.55" stop-color="#ff7a8a" stop-opacity="0.13" />
      <stop offset="1" stop-color="#ff7a8a" stop-opacity="0" />
    </radialGradient>

    <!-- Light from the upper left, so the body shades itself and needs no
         painted-on highlight. -->
    <radialGradient id="cream" cx="0.34" cy="0.28" r="0.88">
      <stop offset="0" stop-color="#fffdfc" />
      <stop offset="0.55" stop-color="#ffeee9" />
      <stop offset="1" stop-color="#f3c0b4" />
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fffdfc" />
      <stop offset="1" stop-color="#f0b8ac" />
    </linearGradient>

    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)" />

    <!-- Blast rays. Faint enough to read as light rather than as spokes. -->
    <g opacity="0.45">
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(30 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(60 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(90 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(120 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(150 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(180 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(210 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(240 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(270 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(300 512 512)" />
      <path d="M512 512 L455 -240 L569 -240 Z" fill="#ffd9b0" opacity="0.13" transform="rotate(330 512 512)" />
    </g>

    <rect x="100" y="100" width="824" height="824" fill="url(#glow)" />
  </g>

  <!-- Fuse assembly: neck, then the pin rod running out to the pull ring.
       The rod is what stops this reading as an ornament hanger; the ring is
       kept large relative to the rod so it does not read as a key either. -->
  <g transform="rotate(-12 500 400)" fill="url(#metal)">
    <rect x="442" y="284" width="116" height="130" rx="20" />
    <rect x="548" y="316" width="150" height="26" rx="13" />
    <circle cx="740" cy="329" r="70" fill="none" stroke="url(#metal)" stroke-width="26" />
  </g>

  <!-- Bomb body -->
  <circle cx="500" cy="606" r="222" fill="url(#cream)" />

  <!-- Eyes: inner ends low, so it glares instead of dozing. -->
  <g stroke="#45101f" stroke-width="36" stroke-linecap="round">
    <line x1="392" y1="544" x2="458" y2="574" />
    <line x1="542" y1="574" x2="608" y2="544" />
  </g>

  <!-- Grin as a single zigzag path: five fangs that stay crisp at any size,
       with no clipped-off stubs along the bottom. -->
  <path
    d="M392 632 L414 678 L436 632 L458 678 L480 632 L502 678 L524 632 L546 678 L568 632 L590 678 L608 632
       Q602 736 500 748 Q398 736 392 632 Z"
    fill="#45101f" />

  <!-- Sparks: a little kinetic punctuation. -->
  <path d="M300 306 L309 336 L339 345 L309 354 L300 384 L291 354 L261 345 L291 336 Z" fill="#ffe9c8" opacity="0.85" />
  <path d="M762 664 L768 684 L788 690 L768 696 L762 716 L756 696 L736 690 L756 684 Z" fill="#ffe9c8" opacity="0.6" />

  <!-- Glass edge -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" />
</svg>
